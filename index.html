<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrutalBudget — Pencatat Keuangan Personal</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="wrap hero brutal-box">
      <h1>BrutalBudget</h1>
      <p>Pencatat keuangan personal — cepat, tegas, tanpa ribet.</p>
    </header>

    <main class="wrap grid">
      <section class="brutal-box">
        <h2>Tambah Transaksi</h2>
        <form id="tx-form" class="stack">
          <label>Deskripsi
            <input required name="description" placeholder="Contoh: Makan siang" />
          </label>

          <label>Nominal (Rp)
            <input required name="amount" type="number" min="0" step="1000" placeholder="25000" />
          </label>

          <label>Tipe
            <select name="type">
              <option value="expense">Pengeluaran</option>
              <option value="income">Pemasukan</option>
            </select>
          </label>

          <label>Tanggal
            <input required name="date" type="date" />
          </label>

          <button type="submit">Simpan</button>
        </form>
      </section>

      <section class="brutal-box">
        <h2>Ringkasan</h2>
        <div class="stats">
          <div><strong>Pemasukan</strong><span id="income">Rp0</span></div>
          <div><strong>Pengeluaran</strong><span id="expense">Rp0</span></div>
          <div><strong>Saldo</strong><span id="balance">Rp0</span></div>
        </div>
      </section>

      <section class="brutal-box full">
        <h2>Riwayat Transaksi</h2>
        <ul id="tx-list" class="tx-list"></ul>
      </section>
    </main>

    <script src="./src/app.js"></script>
  </body>
</html>
